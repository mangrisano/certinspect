[project]
name = "certinspect"
version = "1.11.0"
description = "Command-line TLS certificate inspector"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michele Angrisano" }]
keywords = ["tls", "ssl", "certificate", "x509", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "prometheus-client>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/mangrisano/certinspect"
Repository = "https://github.com/mangrisano/certinspect"
Issues = "https://github.com/mangrisano/certinspect/issues"

[project.scripts]
certinspect = "certinspect.cli:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Pin the classic default rule set (pyflakes + a subset of pycodestyle) so
# linting stays reproducible no matter which ruff version CI installs: a newer
# ruff that enables extra rule families by default must not spontaneously break
# the build. Opt into more rules deliberately, not by tool drift.
select = ["E4", "E7", "E9", "F"]
